<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云栖校园 · 高保真原型</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232E6BFF'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif'>云</text></svg>">
<style>
  :root{
    --primary:#2E6BFF; --primary-dark:#1F56D6; --bg:#F5F7FA; --card:#ffffff;
    --text:#1A1D26; --sub:#6B7280; --line:#ECEEF2; --green:#07C160; --orange:#FF9500;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#E9EDF5 0%,#DCE4F2 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;
    color:var(--text);
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage .hint{font-size:12px;color:#8a93a6;letter-spacing:.5px}
  /* 手机外壳 */
  .phone{
    width:390px;height:780px;background:#0B0D12;border-radius:46px;padding:12px;
    box-shadow:0 30px 80px rgba(31,55,120,.28),0 4px 16px rgba(0,0,0,.15);
    position:relative;
  }
  .screen{
    width:100%;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
  }
  /* 状态栏 */
  .statusbar{
    height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:13px;font-weight:600;color:var(--text);background:#fff;
  }
  .statusbar .icons{display:flex;gap:6px;align-items:center}
  /* 导航栏 */
  .navbar{
    flex:0 0 46px;background:#fff;display:flex;align-items:center;justify-content:center;
    position:relative;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;
  }
  .navbar .back{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
  }
  /* 内容区 */
  .view{flex:1;overflow-y:auto;padding:14px 14px 90px;scrollbar-width:none}
  .view::-webkit-scrollbar{display:none}
  /* 底部 Tabbar */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;
    border-top:1px solid var(--line);display:flex;
  }
  .tabbar .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10px;color:var(--sub);cursor:pointer;
  }
  .tabbar .tab svg{width:23px;height:23px}
  .tabbar .tab.active{color:var(--primary);font-weight:600}
  /* 通用组件 */
  .search{
    background:#F0F2F7;border-radius:18px;height:36px;display:flex;align-items:center;
    padding:0 14px;gap:8px;color:var(--sub);font-size:13px;cursor:pointer;
  }
  .card{background:var(--card);border-radius:14px;box-shadow:0 2px 8px rgba(30,50,100,.05)}
  .btn{
    display:block;text-align:center;background:var(--primary);color:#fff;border-radius:22px;
    height:44px;line-height:44px;font-size:15px;font-weight:600;cursor:pointer;border:none;width:100%;
  }
  .btn.green{background:var(--green)}
  .btn.ghost{background:#EEF3FF;color:var(--primary)}
  .tag{
    display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:#EEF3FF;color:var(--primary);
  }
  /* 首页 */
  .banner{
    margin-bottom:14px;height:110px;border-radius:18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#2E6BFF 0%,#5B8CFF 60%,#8FB0FF 100%);
    padding:18px 18px;display:flex;flex-direction:column;justify-content:center;
  }
  .banner::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15)}
  .banner .t1{font-size:18px;font-weight:700;margin-bottom:6px}
  .banner .t2{font-size:12px;opacity:.9}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .grid .g{
    background:var(--card);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;
    align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer;
  }
  .grid .g .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .grid .g .ic svg{width:21px;height:21px}
  .sec-title{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}
  .sec-title h3{font-size:15px;font-weight:700}
  .sec-title span{font-size:12px;color:var(--sub);cursor:pointer}
  .news-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .news-item:last-child{border-bottom:none}
  .news-thumb{
    width:86px;height:62px;border-radius:10px;flex:0 0 86px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:22px;font-weight:700;
  }
  .news-item .ti{font-size:14px;line-height:1.45;margin-bottom:6px}
  .news-item .meta{font-size:11px;color:var(--sub)}
  /* 课表 */
  .weekbar{display:flex;gap:8px;overflow-x:auto;padding:2px;margin-bottom:12px}
  .weekbar .w{flex:0 0 auto;padding:6px 12px;border-radius:14px;background:#fff;font-size:12px;color:var(--sub);cursor:pointer}
  .weekbar .w.on{background:var(--primary);color:#fff;font-weight:600}
  .daybar{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px}
  .daybar .d{flex:1;text-align:center;font-size:13px;padding:8px 0;color:var(--sub);border-radius:11px;cursor:pointer}
  .daybar .d.on{background:#EEF3FF;color:var(--primary);font-weight:700}
  .sched{display:grid;grid-template-columns:34px 1fr;gap:8px}
  .sched .sec-num{
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);
  }
  .course{
    border-radius:10px;padding:10px;font-size:12px;line-height:1.4;color:#fff;min-height:52px;margin-bottom:8px;
  }
  .course b{font-size:13px;display:block;margin-bottom:2px}
  .course span{font-size:10px;opacity:.9}
  .empty{color:#C2C8D4;font-size:12px;text-align:center;padding:18px 0}
  /* 二手列表 */
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
  .chips .c{flex:0 0 auto;padding:6px 12px;border-radius:14px;background:#fff;font-size:12px;color:var(--sub);cursor:pointer}
  .chips .c.on{background:var(--primary);color:#fff;font-weight:600}
  .goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .goods{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer}
  .goods .ph{
    height:110px;display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .goods .ph svg{width:34px;height:34px}
  .goods .body{padding:9px 10px 12px}
  .goods .tt{font-size:13px;line-height:1.4;height:36px;overflow:hidden;margin-bottom:6px}
  .goods .pr{color:#FF4D3D;font-weight:700;font-size:15px}
  .goods .loc{font-size:10px;color:var(--sub);margin-top:3px}
  .fab{
    position:absolute;right:16px;bottom:80px;width:54px;height:54px;border-radius:50%;
    background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(46,107,255,.4);cursor:pointer;z-index:5;
  }
  .fab svg{width:26px;height:26px}
  /* 详情 */
  .hero{height:200px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:14px}
  .hero svg{width:64px;height:64px}
  .price{color:#FF4D3D;font-size:24px;font-weight:800}
  .meta-row{display:flex;gap:8px;font-size:12px;color:var(--sub);margin:8px 0}
  .block{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
  .block h4{font-size:13px;margin-bottom:8px}
  .block p{font-size:13px;line-height:1.7;color:#3A3F4C}
  .seller{display:flex;align-items:center;gap:10px}
  .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7AA5FF,#B7CDFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .bottom-bar{
    position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 14px calc(10px + 10px);display:flex;gap:10px;align-items:center;
  }
  .bottom-bar .fav{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub);width:46px;cursor:pointer}
  .bottom-bar .fav svg{width:22px;height:22px;margin-bottom:2px}
  /* 表单 */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .input,.textarea{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    font-size:14px;outline:none;font-family:inherit;
  }
  .textarea{min-height:88px;resize:none}
  .upload{
    border:1.5px dashed #C9D2E4;border-radius:12px;height:88px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#9AA3B5;font-size:12px;gap:6px;cursor:pointer;background:#fff;
  }
  /* 失物 */
  .lost-tabs{display:flex;background:#fff;border-radius:14px;margin-bottom:12px;padding:4px}
  .lost-tabs .lt{flex:1;text-align:center;padding:8px 0;font-size:13px;color:var(--sub);border-radius:11px;cursor:pointer}
  .lost-tabs .lt.on{background:#FFEFE9;color:#F06B3B;font-weight:700}
  .lost-card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px}
  .lost-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .badge{font-size:10px;padding:2px 8px;border-radius:8px}
  .badge.miss{background:#FFF1E8;color:#F06B3B}
  .badge.found{background:#E8F7EE;color:#07C160}
  .lost-card .tt{font-size:14px;font-weight:600;margin-bottom:6px}
  .lost-card .row{font-size:12px;color:var(--sub);display:flex;gap:5px;align-items:center;margin-top:4px}
  .lost-card .row svg{width:13px;height:13px}
  /* 我的 */
  .me-card{
    background:linear-gradient(135deg,#2E6BFF,#5B8CFF);border-radius:18px;color:#fff;
    padding:20px 16px;display:flex;align-items:center;gap:14px;margin-bottom:14px;
  }
  .me-card .avatar{width:56px;height:56px;background:rgba(255,255,255,.25)}
  .me-card .n{font-size:17px;font-weight:700;margin-bottom:4px}
  .me-card .r{font-size:11px;opacity:.85}
  .menu{background:#fff;border-radius:14px;overflow:hidden}
  .menu .m{
    display:flex;align-items:center;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;
  }
  .menu .m:last-child{border-bottom:none}
  .menu .m svg{width:19px;height:19px;color:var(--sub)}
  .menu .m .arr{margin-left:auto;color:#C2C8D4}
  /* Toast */
  .toast{
    position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,25,40,.85);
    color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:20;white-space:nowrap;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="stage">

/* ============ 工具 ============ */
function go(h){location.hash=h;window.scrollTo(0,0);}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500);
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function catPh(cat){const c=CAT_COLOR[cat]||'#2E6BFF';
  return '<div class="ph" style="background:linear-gradient(135deg,'+c+','+c+'BB)">'+IC.doc+'</div>';}

/* ============ 视图：首页 ============ */
function viewHome(){
  const news=NEWS.slice(0,3).map(n=>
    '<div class="news-item" onclick="go(\'#/news/'+n.id+'\')">'+
      '<div class="news-thumb" style="background:linear-gradient(135deg,'+n.color[0]+','+n.color[1]+')">'+IC.news+'</div>'+
      '<div style="flex:1;min-width:0"><div class="ti">'+esc(n.title)+'</div>'+
      '<div class="meta">'+n.date+' · 阅读 1.2k</div></div></div>').join('');
  return ''+
  '<div class="search" onclick="toast(\'原型演示：搜索框\')">'+IC.search+'搜索教材 / 闲置 / 物品</div>'+
  '<div style="height:12px"></div>'+
  '<div class="banner"><div class="t1">校园生活，一站搞定</div>'+
  '<div class="t2">课表 · 二手 · 失物招领 · 校园资讯</div></div>'+
  '<div class="grid">'+
    '<div class="g" onclick="go(\'#/schedule\')"><div class="ic" style="background:#EEF3FF;color:#2E6BFF">'+IC.sched+'</div>课表</div>'+
    '<div class="g" onclick="go(\'#/market\')"><div class="ic" style="background:#FFF1E8;color:#F06B3B">'+IC.tag+'</div>二手</div>'+
    '<div class="g" onclick="go(\'#/lost\')"><div class="ic" style="background:#E8F7EE;color:#07C160">'+IC.lost+'</div>失物</div>'+
    '<div class="g" onclick="go(\'#/news\')"><div class="ic" style="background:#F3EDFF;color:#7A5CFF">'+IC.news+'</div>资讯</div>'+
    '<div class="g" onclick="toast(\'跑腿代办：V1.1 预留\')"><div class="ic" style="background:#FFF7E6;color:#FF9500">'+IC.chat+'</div>跑腿</div>'+
    '<div class="g" onclick="go(\'#/profile\')"><div class="ic" style="background:#EEF3FF;color:#2E6BFF">'+IC.me+'</div>我的发布</div>'+
  '</div>'+
  '<div class="sec-title"><h3>校园资讯</h3><span onclick="go(\'#/news\')">全部 ›</span></div>'+
  '<div class="card" style="padding:4px 14px">'+news+'</div>';
}

/* ============ 视图：课表 ============ */
function viewSchedule(){
  const days=['一','二','三','四','五'];
  const rows=[];
  for(let i=1;i<=5;i++){
    const cls=(SCHEDULE[curDay]||[]).filter(c=>c.sec===i);
    rows.push('<div class="sec-num">'+(i*2-1)+'-'+(i*2)+'</div>'+
      (cls.length?('<div class="course" style="background:'+cls[0].c+'"><b>'+esc(cls[0].name)+'</b><span>'+esc(cls[0].room)+' · '+esc(cls[0].teacher)+'</span></div>')
                :'<div class="empty">—</div>'));
  }
  return '<div class="weekbar">'+[5,6,7,8,9].map(w=>'<div class="w '+(w===8?'on':'')+'" onclick="toast(\'第'+w+'周\')">第'+w+'周</div>').join('')+'</div>'+
  '<div class="daybar">'+days.map((d,i)=>'<div class="d '+(curDay===i+1?'on':'')+'" onclick="curDay='+(i+1)+';render()">周'+d+'</div>').join('')+'</div>'+
  '<div class="card" style="padding:12px"><div class="sched">'+rows.join('')+'</div></div>';
}

/* ============ 视图：二手市场 ============ */
function viewMarket(){
  const list=curCat==='全部'?GOODS:GOODS.filter(g=>g.cat===curCat);
  const items=list.map(g=>
    '<div class="goods" onclick="go(\'#/goods/'+g.id+'\')">'+catPh(g.cat)+
    '<div class="body"><div class="tt">'+esc(g.title)+'</div>'+
    '<div class="pr">¥'+g.price+'</div><div class="loc">'+esc(g.loc)+'</div></div></div>').join('');
  return '<div class="search" onclick="toast(\'原型演示：搜索\')">'+IC.search+'搜索闲置物品</div>'+
  '<div style="height:12px"></div>'+
  '<div class="chips">'+CATS.map(c=>'<div class="c '+(curCat===c?'on':'')+'" onclick="curCat=\''+c+'\';render()">'+c+'</div>').join('')+'</div>'+
  '<div class="goods-grid">'+items+'</div>'+
  '<div class="fab" onclick="go(\'#/publish\')">'+IC.plus+'</div>';
}

/* ============ 视图：商品详情 ============ */
function viewGoods(h){
  const id=parseInt((h.split('/')[2]||'1').split('?')[0],10);
  const g=GOODS.find(x=>x.id===id)||GOODS[0];
  const c=CAT_COLOR[g.cat];
  return '<div class="hero" style="background:linear-gradient(135deg,'+c+','+c+'BB)">'+IC.doc+'</div>'+
  '<div class="price">¥'+g.price+'</div>'+
  '<div style="font-size:16px;font-weight:700;margin:8px 0">'+esc(g.title)+'</div>'+
  '<div class="meta-row"><span class="tag">'+g.cat+'</span><span>'+g.loc+'</span><span>'+g.date+'</span></div>'+
  '<div class="block"><h4>商品描述</h4><p>'+esc(g.desc)+'</p></div>'+
  '<div class="block"><div class="seller"><div class="avatar">同</div><div>'+
  '<div style="font-weight:600;font-size:14px">同学A</div>'+
  '<div class="meta-row" style="margin:2px 0 0">信用良好 · 已发布 3 件</div></div></div></div>'+
  '<div style="height:80px"></div>'+
  '<div class="bottom-bar">'+
    '<div class="fav" onclick="toast(\'已收藏\')">'+IC.heart+'收藏</div>'+
    '<button class="btn green" onclick="toast(\'演示：调起微信咨询\')">联系卖家</button>'+
  '</div>';
}

/* ============ 视图：发布二手 ============ */
function viewPublish(){
  return '<div class="field"><label>标题</label><input class="input" placeholder="一句话描述物品，如：九成新教材"></div>'+
  '<div class="field"><label>分类</label><div class="chips">'+['教材','电子','生活用品','代步','其他'].map(c=>'<div class="c">'+c+'</div>').join('')+'</div></div>'+
  '<div class="field"><label>价格（元）</label><input class="input" type="number" placeholder="0"></div>'+
  '<div class="field"><label>描述</label><textarea class="textarea" placeholder="成色、入手时间、交易地点…"></textarea></div>'+
  '<div class="field"><label>上传图片（最多 3 张）</label><div class="upload" onclick="toast(\'原型演示：选择图片\)">'+IC.camera+'点击上传</div></div>'+
  '<div class="field"><label>联系方式</label><input class="input" placeholder="微信号 / 手机号"></div>'+
  '<div style="height:12px"></div>'+
  '<button class="btn" onclick="toast(\'发布成功（演示）\');setTimeout(function(){go(\'#/market\')},700)">提交发布</button>';
}

/* ============ 视图：失物招领 ============ */
function viewLost(){
  const list=LOST.filter(x=>x.type===lostType);
  const cards=list.map(l=>
    '<div class="lost-card"><div class="top"><span class="badge '+l.type+'">'+(l.type==='miss'?'寻物启事':'招领启事')+'</span>'+
    '<span style="font-size:11px;color:var(--sub)">'+l.time+'</span></div>'+
    '<div class="tt">'+esc(l.title)+'</div>'+
    '<div style="font-size:12px;color:#3A3F4C;line-height:1.5">'+esc(l.desc)+'</div>'+
    '<div class="row">'+IC.place+esc(l.place)+'</div></div>').join('');
  return '<div class="lost-tabs"><div class="lt '+(lostType==='miss'?'on':'')+'" onclick="lostType=\'miss\';render()">寻物启事</div>'+
  '<div class="lt '+(lostType==='found'?'on':'')+'" onclick="lostType=\'found\';render()">招领启事</div></div>'+
  cards+
  '<div class="fab" onclick="toast(\'演示：发布启事\')">'+IC.plus+'</div>';
}

/* ============ 视图：资讯列表 ============ */
function viewNews(){
  return NEWS.map(n=>
    '<div class="news-item" onclick="go(\'#/news/'+n.id+'\')">'+
    '<div class="news-thumb" style="background:linear-gradient(135deg,'+n.color[0]+','+n.color[1]+')">'+IC.news+'</div>'+
    '<div style="flex:1;min-width:0"><div class="ti">'+esc(n.title)+'</div>'+
    '<div class="meta">'+n.date+' · '+esc(n.summary)+'</div></div></div>').join('');
}

/* ============ 视图：资讯详情 ============ */
function viewNewsDetail(h){
  const id=parseInt((h.split('/')[2]||'1').split('?')[0],10);
  const n=NEWS.find(x=>x.id===id)||NEWS[0];
  const paras=n.body.split('\n').map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="hero" style="background:linear-gradient(135deg,'+n.color[0]+','+n.color[1]+')">'+IC.news+'</div>'+
  '<div style="font-size:18px;font-weight:700;line-height:1.5;margin:6px 0">'+esc(n.title)+'</div>'+
  '<div class="meta-row">校团委 · '+n.date+' · 阅读 1.2k</div>'+
  '<div class="block">'+paras+'</div>';
}

/* ============ 视图：我的 ============ */
function viewProfile(){
  const items=[[IC.doc,'我的发布'],[IC.heart,'我的收藏'],[IC.chat,'联系客服'],[IC.set,'设置']];
  return '<div class="me-card"><div class="avatar">同</div><div><div class="n">同学A</div>'+
  '<div class="r">微信授权登录 · 在校学生</div></div></div>'+
  '<div class="menu">'+items.map(it=>
    '<div class="m" onclick="toast(\'演示：'+it[1]+'\')">'+it[0]+it[1]+'<span class="arr">›</span></div>').join('')+'</div>'+
  '<div style="text-align:center;color:#B6BDCC;font-size:11px;margin-top:18px">云栖校园 V1.0 原型</div>';
}

/* ============ 渲染入口 ============ */
const ROUTES=[
  {re:/^#\/home/,title:'云栖校园',tab:'home',back:false,render:viewHome},
  {re:/^#\/schedule/,title:'我的课表',tab:'schedule',back:false,render:viewSchedule},
  {re:/^#\/market/,title:'二手市场',tab:'market',back:false,render:viewMarket},
  {re:/^#\/goods/,title:'商品详情',tab:'market',back:true,render:viewGoods},
  {re:/^#\/publish/,title:'发布二手',tab:'market',back:true,render:viewPublish},
  {re:/^#\/lost/,title:'失物招领',tab:'lost',back:false,render:viewLost},
  {re:/^#\/news\/\d+/,title:'资讯详情',tab:null,back:true,render:viewNewsDetail},
  {re:/^#\/news/,title:'校园资讯',tab:null,back:false,render:viewNews},
  {re:/^#\/profile/,title:'我的',tab:'me',back:false,render:viewProfile}
];
function render(){
  const h=location.hash||'#/home';
  let route=ROUTES.find(r=>r.re.test(h))||ROUTES[0];
  document.getElementById('navbar').innerHTML=
    (route.back?('<div class="back" onclick="history.back()">'+IC.back+'</div>'):'')+route.title;
  document.getElementById('view').innerHTML=route.render(h);
  document.getElementById('tabbar').innerHTML=TABS.map(t=>
    '<div class="tab '+(t.key===route.tab?'active':'')+'" onclick="go(\''+t.hash+'\')">'+t.ic+t.label+'</div>').join('');
  document.querySelector('.view').scrollTop=0;
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
